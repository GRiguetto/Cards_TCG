<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="src/css/menu.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="menu-container">
        <h1 class="game-title">Não tem titulo ainda</h1>
        <h2 class="game-subtitle">verção 0.4</h2>

        <div class="menu-options">
            <button class = "menu-btn" onclick="abrirTreino()">
                <span class="btn-text">Treinar</span>
            </button>

            <button class="menu-btn" onclick="abrirBiblioteca()">
                <span class="btn-text">Biblioteca</span>
            </button>

            <button class="menu-btn" onclick="sairJogo()">
                <span class="btn-text">Sair</span>
            </button>
        </div>
    </div>

    <script>
        
        function abrirBiblioteca(){
            window.location.href = "biblioteca.html"
        }

        function abrirTreino() {
            window.location.href = "arena.html"
        }

        function sairJogo() {
       
            if (confirm("Tem certeza que deseja abandonar sua jornada?")) {
                window.close(); // Tenta fechar a aba
                window.location.href = "https://www.google.com"; // Fallback se o navegador bloquear o close
            }
        }

    </script>
</body>
</html>
